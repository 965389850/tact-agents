[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dyadic-tacit-llm-agents"
version = "0.1.0"
description = "Online directional dyadic tacit-state formation for frozen LLM agents"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<0.28",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dyadic_tacit*"]

